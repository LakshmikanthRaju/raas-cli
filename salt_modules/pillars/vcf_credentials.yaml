# VCF Credentials Pillar Example
# 
# This pillar data provides credentials for the vcf_version Salt execution module.
# 
# Installation:
#   1. Copy this file to your Salt pillar directory (e.g., /srv/pillar/vcf_credentials.sls)
#   2. Add it to your top.sls targeting appropriate minions
#   3. Refresh pillar: salt '*' saltutil.refresh_pillar
#
# Security Notes:
#   - Pillar data is encrypted in transit and stored securely
#   - Use Salt pillar GPG encryption for additional security in production
#   - Consider using external pillar sources (vault, AWS secrets manager) for enterprise deployments
#   - Limit pillar targeting to only minions that need these credentials
#
# top.sls example:
#   base:
#     'vcfops_resource_kind:nsx':
#       - match: grain
#       - vcf_credentials
#     'vcfops_resource_kind:vcenter':
#       - match: grain
#       - vcf_credentials

vcf_credentials:
  # NSX Manager credentials
  # Used by: vcf_version.get_nsx_version
  # Auth method: HTTP Basic Auth
  nsxm:
    username: admin
    password: REPLACE_WITH_SECRET_FROM_KEYRING_OR_VAULT
    # Optional: specify host if different from localhost
    # host: nsx-manager.example.com

  # vCenter Server credentials
  # Used by: vcf_version.get_vcenter_version
  # Auth method: Session token via /api/session
  vcenter:
    username: administrator@vsphere.local
    password: REPLACE_WITH_SECRET_FROM_KEYRING_OR_VAULT
    # Optional: specify host if different from localhost
    # host: vcenter.example.com

  # SDDC Manager credentials
  # Used by: vcf_version.get_sddc_manager_version
  # Auth method: Bearer token via /v1/tokens
  sddc_manager:
    username: administrator@vsphere.local
    password: REPLACE_WITH_SECRET_FROM_KEYRING_OR_VAULT
    # Optional: specify host if different from localhost
    # host: sddc-manager.example.com

  # Aria Operations (vROps) credentials
  # Used by: vcf_version.get_aria_operations_version
  # Auth method: OpsToken via /suite-api/api/auth/token/acquire
  aria_operations:
    username: admin
    password: REPLACE_WITH_SECRET_FROM_KEYRING_OR_VAULT
    # Optional: specify host if different from localhost
    # host: aria-ops.example.com
