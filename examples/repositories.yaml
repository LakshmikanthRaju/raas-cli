# Non-secret Git source catalog. Import with:
#   scc repo import examples/repositories.yaml
version: 1
default_states_source: vcf-salt
default_data_source: customer-values
sources:
  vcf-salt:
    kind: states
    url: https://git.example.com/shared/vcf-salt.git
    ref: v9.1.1
    root: vcf-infra
    layout: "{resource}"
    auth: credential-helper
    verify_tls: true
    description: Reusable reviewed Salt states and templates
  customer-values:
    kind: data
    url: ssh://git@git.example.com/customer/config-values.git
    ref: approved/9.1.1
    root: .
    layout: "{environment}/{version}/{resource}/values.yaml"
    auth: ssh
    verify_tls: true
    description: Approved customer, environment, and version values
